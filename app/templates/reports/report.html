{% extends "base.html" %}
{% block title %}Жалоба — {{ achievement.title }}{% endblock %}
{% block content %}
  <h1>Пожаловаться на достижение</h1>
  <p class="muted">
    Жалоба на «<a href="/achievements/{{ achievement.id }}">{{ achievement.title }}</a>».
    Жалобы рассматривает модератор.
  </p>
  <form method="post" action="/achievements/{{ achievement.id }}/report" class="card stack">
    <input type="hidden" name="_csrf" value="{{ request.state.csrf_token }}">
    <div class="field">
      <label for="reason">Причина *</label>
      <select id="reason" name="reason" required>
        <option value="duplicate">Дубликат существующего достижения</option>
        <option value="incorrect">Некорректное описание или требования</option>
        <option value="spam">Спам</option>
        <option value="offensive">Оскорбительный контент</option>
        <option value="other">Другое</option>
      </select>
    </div>
    <div class="field">
      <label for="description">Подробнее (необязательно)</label>
      <textarea id="description" name="description" rows="4" maxlength="2000"></textarea>
    </div>
    <button type="submit" class="btn">Отправить жалобу</button>
  </form>
  <p><a href="/achievements/{{ achievement.id }}">← Вернуться к достижению</a></p>
{% endblock %}
