{% extends "base.html" %}

{% block title %}Новое достижение{% endblock %}

{% block content %}
<section class="auth-card auth-card-wide">
  <h1>Предложить достижение</h1>
  <form method="post" action="/achievements/create" class="stack">
    <label class="field">
      <span class="field-label">Название</span>
      <input type="text" name="title" value="{{ title }}" required maxlength="200">
    </label>
    <label class="field">
      <span class="field-label">Категория</span>
      <select name="category_id">
        <option value="">— не выбрана —</option>
        {% for c in categories %}
          <option value="{{ c.id }}" {% if category_id|string == c.id|string %}selected{% endif %}>{{ c.name }}</option>
        {% endfor %}
      </select>
    </label>
    <label class="field">
      <span class="field-label">Описание</span>
      <textarea name="description" rows="4" maxlength="4000">{{ description }}</textarea>
    </label>
    <label class="field">
      <span class="field-label">Требования / критерии выполнения</span>
      <textarea name="requirements" rows="3" maxlength="4000">{{ requirements }}</textarea>
    </label>
    <button type="submit" class="btn btn-primary">Отправить на модерацию</button>
  </form>
  <p class="muted">Достижение публикуется только после проверки модератором доказательства вашего собственного выполнения.</p>
</section>
{% endblock %}
