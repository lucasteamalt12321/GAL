{% extends "base.html" %}
{% block title %}Ошибка {{ status_code }}{% endblock %}
{% block content %}
<section class="error-page">
  <p class="error-code">{{ status_code }}</p>
  <h1>Не удалось выполнить запрос</h1>
  <p class="muted">{{ detail or "Попробуйте ещё раз или вернитесь на главную." }}</p>
  <div class="row">
    <a class="btn btn-primary" href="/">На главную</a>
  </div>
</section>
{% endblock %}
