{% extends "base.html" %}
{% block title %}Сервис временно недоступен{% endblock %}
{% block content %}
<section class="error-page">
  <p class="error-code">503</p>
  <h1>Сервис временно недоступен</h1>
  <p class="muted">
    Не удалось загрузить данные — сервис хранения временно недоступен.
    Обычно это проходит за минуту; страницу можно обновить.
  </p>
  <div class="row">
    <button type="button" class="btn btn-primary" data-reload>Обновить страницу</button>
    <a class="btn" href="/">На главную</a>
  </div>
</section>
{% endblock %}
