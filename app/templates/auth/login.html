{% extends "base.html" %}

{% block title %}Sign in{% endblock %}

{% block content %}
<section class="auth-card">
  <h1>Sign in</h1>
  <form method="post" action="/auth/login" class="stack">
    <input type="hidden" name="_csrf" value="{{ request.state.csrf_token }}">
    <label class="field">
      <span class="field-label">Email</span>
      <input type="email" name="email" value="{{ email }}" required autocomplete="email">
    </label>
    <label class="field">
      <span class="field-label">Password</span>
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <button type="submit" class="btn btn-primary">Sign in</button>
  </form>
  <p class="muted"><a href="/auth/recover">Forgot password?</a></p>
  <p class="muted">No account? <a href="/auth/register">Register</a></p>
</section>
{% endblock %}
