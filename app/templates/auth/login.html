{% extends "base.html" %}

{% block title %}Вход{% endblock %}

{% block content %}
<section class="auth-card">
  <h1>Вход</h1>
  <form method="post" action="/auth/login" class="stack">
    <input type="hidden" name="_csrf" value="{{ request.state.csrf_token }}">
    <label class="field">
      <span class="field-label">Email или никнейм</span>
      <input type="text" name="email" value="{{ email }}" required autocomplete="username"
             placeholder="TonyBig или name@example.com" autocapitalize="none" spellcheck="false">
      <span class="hint muted">Можно войти по никнейму или по email.</span>
    </label>
    <label class="field">
      <span class="field-label">Пароль</span>
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <button type="submit" class="btn btn-primary">Войти</button>
  </form>
  {% if lthub_oauth_enabled %}
    <div class="auth-divider"><span>или</span></div>
    <a class="btn btn-lthub" href="/auth/lthub">Войти через LThub</a>
  {% endif %}
  <p class="muted"><a href="/auth/recover">Забыли пароль?</a></p>
  <p class="muted">Нет аккаунта? <a href="/auth/register">Зарегистрироваться</a></p>
</section>
{% endblock %}
