{% extends "base.html" %}

{% block title %}Новый пароль{% endblock %}

{% block content %}
<section class="auth-card">
  <h1>Новый пароль</h1>
  <p class="muted" id="reset-status">Проверяем ссылку восстановления…</p>

  <form id="reset-form" class="stack" hidden>
    <label class="field">
      <span class="field-label">Новый пароль</span>
      <input type="password" id="new-password" required minlength="6" autocomplete="new-password">
    </label>
    <label class="field">
      <span class="field-label">Повторите пароль</span>
      <input type="password" id="new-password-confirm" required minlength="6" autocomplete="new-password">
    </label>
    <button type="submit" class="btn btn-primary">Сохранить пароль</button>
  </form>

  <div id="reset-error" class="flash flash-error" hidden></div>
  <div id="reset-success" class="flash flash-info" hidden></div>

  <p class="muted"><a href="/auth/login">Вернуться к входу</a></p>
</section>

<script>
(function () {
  "use strict";
  var SUPABASE_URL = {{ supabase_url|tojson }};
  var SUPABASE_ANON_KEY = {{ supabase_anon_key|tojson }};

  var statusEl = document.getElementById("reset-status");
  var form = document.getElementById("reset-form");
  var errorEl = document.getElementById("reset-error");
  var successEl = document.getElementById("reset-success");

  function showError(message) {
    statusEl.hidden = true;
    errorEl.textContent = message;
    errorEl.hidden = false;
  }

  var params = new URLSearchParams(window.location.hash.replace(/^#/, ""));
  var accessToken = params.get("access_token");
  var hashError = params.get("error_description") || params.get("error");

  if (hashError) {
    showError("Ссылка недействительна или устарела. Запросите новую на странице восстановления.");
    return;
  }
  if (!accessToken) {
    showError("В ссылке нет токена восстановления. Откройте ссылку из письма ещё раз или запросите новую.");
    return;
  }
  statusEl.textContent = "Придумайте новый пароль.";
  form.hidden = false;

  form.addEventListener("submit", function (event) {
    event.preventDefault();
    errorEl.hidden = true;
    successEl.hidden = true;
    var password = document.getElementById("new-password").value;
    var confirm = document.getElementById("new-password-confirm").value;
    if (password !== confirm) {
      showError("Пароли не совпадают.");
      return;
    }
    if (password.length < 6) {
      showError("Пароль должен быть не короче 6 символов.");
      return;
    }
    var button = form.querySelector('button[type="submit"]');
    button.disabled = true;
    fetch(SUPABASE_URL.replace(/\/$/, "") + "/auth/v1/user", {
      method: "PUT",
      headers: {
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": "Bearer " + accessToken,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ password: password })
    }).then(function (response) {
      return response.json().catch(function () { return {}; }).then(function (body) {
        return { ok: response.ok, body: body };
      });
    }).then(function (result) {
      if (!result.ok) {
        throw new Error(result.body.msg || result.body.message || "Не удалось сохранить пароль.");
      }
      window.location.hash = "";
      form.hidden = true;
      statusEl.hidden = true;
      successEl.innerHTML = 'Пароль изменён. <a href="/auth/login">Войдите</a> с новым паролем.';
      successEl.hidden = false;
    }).catch(function (error) {
      button.disabled = false;
      showError(error.message || "Не удалось сохранить пароль. Попробуйте ещё раз.");
    });
  });
})();
</script>
{% endblock %}
