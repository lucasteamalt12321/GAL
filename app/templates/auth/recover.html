{% extends "base.html" %}

{% block title %}Восстановление пароля{% endblock %}

{% block content %}
<section class="auth-card">
  <h1>Восстановление пароля</h1>
  <form method="post" action="/auth/recover" class="stack">
    <input type="hidden" name="_csrf" value="{{ request.state.csrf_token }}">
    <label class="field">
      <span class="field-label">Email</span>
      <input type="email" name="email" value="{{ email }}" required autocomplete="email">
    </label>
    <button type="submit" class="btn btn-primary">Отправить ссылку</button>
  </form>
  <p class="muted"><a href="/auth/login">Вернуться к входу</a></p>
</section>
{% endblock %}
